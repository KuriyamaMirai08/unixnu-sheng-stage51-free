name: Stage54 Darwin archive verification and sheng builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_LFS_SKIP_SMUDGE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check runner capacity and toolchain
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = arm64
          test "$(sysctl -n hw.memsize)" -ge 6442450944
          df -h "$GITHUB_WORKSPACE"
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { exit !($4 >= 12582912) }'
          vm_stat
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Build version 17F113'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          xcrun --sdk iphoneos clang --version
      - name: Frozen UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 13e5973748a8447cbb90520c9a2dd5e65e272435
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - name: Frozen sheng board
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 460179565a018c741b93e0b1efa07c55d4de497a
          path: UniXNU-sheng
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Prepare public build tools
        run: |
          set -euo pipefail
          brew install llvm
          if ! command -v unifdef; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          brew list --versions llvm
          "$(brew --prefix llvm)/bin/llvm-objcopy" --version
          cmake --version
          ninja --version
          python3 --version
      - name: Run official XNU bootstrap and selected archive recipes
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git submodule status --recursive
          git -C ../UniXNU-sheng submodule status --recursive
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { exit !($4 >= 8388608) }'
          ./unixnu defconfig sheng_ipados27_defconfig --os 27 -D ../UniXNU-sheng
          python3 -u - <<'PY'
          import hashlib, json, os, re, shlex, shutil, struct, subprocess
          import sys, tempfile, threading
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu import cli, feeds, kernel, patches
          from unixnu.config import Context

          ctx = Context(cli.parser().parse_args([
              'build', 'kernel', '--os', '27', '-D', '../UniXNU-sheng', '-j', '2'
          ]))
          assert ctx.soc.commit == 'a9f45dc60c035084b95463781538380f4c3606c9'
          modules = feeds.resolve(ctx)
          wanted = set(cli.REFERENCES['kernel'])
          for module in modules.values():
              if module.origin == 'git' and (module.kind != 'refer' or module.name in wanted):
                  pin = feeds.pinned_revision(ctx, module, {})
                  url = module.source['git']
                  assert pin and re.fullmatch('[0-9a-f]{40}', pin), module.name
                  assert url.startswith('https://github.com/'), module.name
                  print('git pin', module.name, pin, url)
          modules = cli.prepare(ctx, ['kernel'])
          for name, kind, pin in [
              ('xnu', 'refer', 'ac9718fb1af618d5ce8678d0dc6e8a58f252216f'),
              ('IOStorageFamily', 'refer', '7edb88fbae296fb7c8ce2f64e115e116e566d51c'),
              ('ArmCpu', 'driver', '93a5030c5d983d0ef90f0fca93879d6e36ad1ba8'),
              ('ArmDTPlatform', 'driver', '417ff95d6a6e8607ddea9309ec45c3bfd4a67c60'),
              ('ShengUfs', 'driver', 'af14068c329f4d8693d20a3ed38a435ade04bb75'),
          ]:
              assert feeds.git(modules[kind, name].path, 'rev-parse', 'HEAD').strip() == pin, name

          versions = kernel.version_env(modules, ctx)
          # The official header resolver accepts a commit in place of a tag.
          versions['UNIXNU_DRIVERKIT_TAG'] = 'ac9718fb1af618d5ce8678d0dc6e8a58f252216f'
          versions['UNIXNU_TRUSTCACHE_TAG'] = 'aca3beaa3dfbd42498b42c5e5ce20a938e6554e5'
          os.environ.update(versions)
          patch_list = patches.prepare(ctx, modules)
          generated = ctx.tree / 'build/generated'
          generated.mkdir(parents=True, exist_ok=True)
          env = dict(os.environ, **kernel.xnu_env(ctx))
          env.update(UNIXNU_PATCH_LIST=str(patch_list), UNIXNU_GENERATED_DIR=str(generated),
                     UNIXNU_DEVICE=str(ctx.device), JOBS='2')

          DARWIN_INDEXES = {
              '__.SYMDEF': 4,
              '__.SYMDEF SORTED': 4,
              '__.SYMDEF_64': 8,
              '__.SYMDEF_64 SORTED': 8,
          }


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def archive_members(raw):
              """Read a regular Darwin archive by member offset, preserving duplicate names."""
              require(raw.startswith(b'!<arch>\n'), 'invalid ar magic')
              cursor = 8
              index = None
              objects = []
              while cursor < len(raw):
                  header = raw[cursor:cursor + 60]
                  require(len(header) == 60 and header[58:] == b'`\n', f'invalid ar header at {cursor}')
                  size = header[48:58].strip()
                  require(size.isdigit(), f'invalid ar size at {cursor}')
                  start = cursor + 60
                  end = start + int(size)
                  require(end <= len(raw), f'truncated ar member at {cursor}')
                  name = header[:16].rstrip(b' ')
                  if name.startswith(b'#1/'):
                      length = name[3:]
                      require(length.isdigit() and 0 < int(length) <= end - start, 'invalid BSD extended name')
                      length = int(length)
                      name = raw[start:start + length].rstrip(b'\0')
                      start += length
                  else:
                      name = name.removesuffix(b'/')
                  name = name.decode('utf-8')
                  require(name and not any(ord(ch) < 32 or ch == '/' for ch in name), 'invalid member name')
                  data = raw[start:end]
                  if name in DARWIN_INDEXES:
                      require(index is None and cursor == 8, 'misplaced or duplicate Darwin symbol index')
                      index = (name, data)
                  else:
                      verify_object(data, f'{name} at {cursor}')
                      objects.append((cursor, name, hashlib.sha256(data).hexdigest()))
                  if end % 2:
                      require(raw[end:end + 1] == b'\n', f'invalid ar padding at {end}')
                  cursor = end + end % 2
              require(index is not None, 'missing Darwin symbol index')
              require(objects, 'archive has no arm64e objects')
              verify_index(*index, {entry[0] for entry in objects})
              return objects


          def verify_object(data, label):
              require(len(data) >= 32, f'truncated Mach-O object: {label}')
              magic, cpu, subtype, kind, count, size = struct.unpack_from('<6I', data)
              require((magic, cpu, subtype & 0xffffff, kind) == (0xfeedfacf, 0x100000c, 2, 1),
                      f'expected arm64e MH_OBJECT: {label}')
              end = 32 + size
              require(count > 0 and size <= len(data) - 32 and count <= size // 8,
                      f'invalid Mach-O load commands: {label}')
              cursor = 32
              for _ in range(count):
                  require(cursor + 8 <= end, f'truncated Mach-O load command: {label}')
                  length = struct.unpack_from('<I', data, cursor + 4)[0]
                  require(length >= 8 and length % 8 == 0 and cursor + length <= end,
                          f'invalid Mach-O load command size: {label}')
                  cursor += length
              require(cursor == end, f'inconsistent Mach-O load commands: {label}')


          def verify_index(name, data, member_offsets):
              width = DARWIN_INDEXES[name]
              require(len(data) >= 2 * width, 'truncated Darwin symbol index')
              entries_size = int.from_bytes(data[:width], 'little')
              strings_start = 2 * width + entries_size
              require(entries_size % (2 * width) == 0 and strings_start <= len(data), 'invalid Darwin symbol index size')
              strings_size = int.from_bytes(data[strings_start - width:strings_start], 'little')
              require(strings_size <= len(data) - strings_start, 'truncated Darwin index strings')
              strings = data[strings_start:strings_start + strings_size]
              for offset in range(width, width + entries_size, 2 * width):
                  string_offset = int.from_bytes(data[offset:offset + width], 'little')
                  member_offset = int.from_bytes(data[offset + width:offset + 2 * width], 'little')
                  require(member_offset in member_offsets, 'Darwin index references an unknown member offset')
                  require(string_offset < len(strings) and strings.find(b'\0', string_offset) > string_offset,
                          'Darwin index references an invalid symbol name')

          def execute(command, options):
              print('+', shlex.join(map(str, command)), flush=True)
              process = subprocess.Popen(command, cwd=ctx.tree, env=options, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT, text=True, errors="replace")
              done = threading.Event()
              def monitor():
                  while not done.wait(30):
                      used = subprocess.run(['du', '-sk', str(ctx.tree)], capture_output=True, text=True)
                      free = shutil.disk_usage(ctx.tree).free
                      subprocess.run(['vm_stat'], check=False)
                      print(f'build growth: {used.stdout.strip()} KiB; free={free} bytes', flush=True)
              thread = threading.Thread(target=monitor, daemon=True)
              thread.start()
              lines = []
              for line in process.stdout:
                  lines.append(line)
                  print(line, end='', flush=True)
              rc = process.wait()
              done.set()
              thread.join()
              print(f'exit={rc}', flush=True)
              return rc, "".join(lines)

          def digest(path):
              with path.open('rb') as stream:
                  print(hashlib.file_digest(stream, 'sha256').hexdigest(), path.relative_to(ctx.tree))

          rc, bootstrap_log = execute(['bash', 'scripts/build-xnu-4k-baseline.sh'],
                       dict(env, XNU_BOOT_PROGRESS='0', XNU_BOOTSTRAP='1'))
          obj = ctx.tree / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837'
          evidence = ('osfmk/DEVELOPMENT/startup.o', 'iokit/DEVELOPMENT/IOPlatformExpert.cpo',
                      'bsd/DEVELOPMENT/kern_exec.o')
          for relative in evidence:
              path = obj / relative
              if not path.is_file():
                  raise SystemExit(f'Bootstrap exit={rc}: missing {relative}')
              with path.open('rb') as stream:
                  magic, cpu, subtype, kind = struct.unpack('<4I', stream.read(16))
              assert (magic, cpu, subtype & 0xffffff, kind) == (0xfeedfacf, 0x100000c, 2, 1), relative
              digest(path)
              record = json.loads(Path(str(path) + '.json').read_text().strip().rstrip(','))
              args = record['arguments']
              directory = Path(record['directory'])
              source = (directory / record['file']).resolve()
              output = (directory / args[args.index('-o') + 1]).resolve()
              assert source.is_relative_to(ctx.tree / '.cache/xnu-work') and source.is_file(), record['file']
              assert source.stem == path.stem and output == path.resolve(), relative
              assert record['file'] in args and any('arm64e' in arg for arg in args), relative
              print('compile record', args)
          expected = set(['_boot_log_rounds', '_corecrypto_kext_start', '_native_legacy_display_late_probe', '_native_legacy_display_probe', '_native_ram_block_gpu_addon', '_native_ram_block_volume_seed', '_native_source_storage_start', '_native_verified_block_manifest_sha384', '_native_verified_block_root_authorized', '_native_verified_block_volume_device', '_sheng_boot_watchdog_policy'])
          if rc:
              blocks = re.findall(
                  r'^Undefined symbols for architecture arm64e[.]kernel:\n(.*?)'
                  r'^ld: symbol[(]s[)] not found for architecture arm64e[.]kernel$',
                  bootstrap_log, re.M | re.S)
              observed = re.findall(r'^  "(_\w+)", referenced from:', blocks[0], re.M) if len(blocks) == 1 else []
              diagnostics = [line for line in bootstrap_log.splitlines()
                             if re.search(r'\b(?:fatal )?error:', line, re.I) or line.startswith('ld:')]
              known_warning = r"ld: warning: search path '[^']+/.cache/fakeroot/usr/local/lib/kernel/platform' not found"
              diagnostics = [line for line in diagnostics if not re.fullmatch(known_warning, line)]
              linker_only = diagnostics == [
                  'ld: symbol(s) not found for architecture arm64e.kernel',
                  'clang++: error: linker command failed with exit code 1 (use -v to see invocation)',
              ]
              targets = re.findall(r'^make(?:\[\d+\])?: \*\*\* \[(.+)\] Error \d+$', bootstrap_log, re.M)
              wrappers = {'build_all', 'build_all_bootstrap_DEVELOPMENT^ARM64^BCM2837', 'build'}
              if (rc != 2 or len(observed) != len(expected) or set(observed) != expected
                      or not linker_only or not targets
                      or not targets[0].endswith('/mach.development.bcm2837.unstripped.noctf')
                      or set(targets[1:]) != wrappers):
                  print('Bootstrap link: Unexpected (Fail)', sorted(observed))
                  raise SystemExit(rc)
              print('Bootstrap link: Expected (Fail), original exit=2; continue archive recipes')
          else:
              print('Bootstrap link: Pass, original exit=0')
          env['PATH'] = kernel.toolchain_path(env.get('PATH'))
          header_rc, _ = execute(['python3', 'scripts/prepare-storage-headers.py'], env)
          if header_rc:
              raise SystemExit(header_rc)
          selected = ('ArmDTPlatform', 'ArmCpu', 'ShengUfs')
          recipes = {entry['id']: entry for kind, entry in kernel.archive_plan(ctx)
                     if kind == 'component' and entry['id'] in selected}
          for name in selected:
              assert shutil.disk_usage(ctx.tree).free >= 2 * 1024**3
              recipe = recipes[name]
              assert recipe['build'] == ['build-arm-driver.py', name], name
              rc, _ = execute(['python3', 'scripts/build-arm-driver.py', name], env)
              directory = ctx.tree / ('build/sheng-source-storage' if name == 'ShengUfs'
                                      else str(Path(recipe['outputs'][0]).parent))
              for record in sorted(directory.glob('*command.json')):
                  print('compile record', record.read_text())
              for product in sorted(directory.glob('*.o')) + sorted(directory.glob('*.a')):
                  digest(product)
              if rc:
                  print(name, f'official recipe exit={rc}; inspect diagnostics for failing subprocess')
                  raise SystemExit(rc)
              archive = ctx.tree / recipe['outputs'][0]
              assert archive.is_file(), name
              digest(archive)
              print(name, 'compile exit=0; ar exit=0 (both checked by official recipe)')
              try:
                  data = archive.read_bytes()
                  members = archive_members(data)
                  required = {
                      'ArmDTPlatform': {'_armdt_platform_configured'},
                      'ArmCpu': {'_armcpu_spi_attach'},
                      'ShengUfs': {'_native_source_storage_start', '_native_verified_block_root_authorized'},
                  }[name]
                  defined = set()
                  with tempfile.TemporaryDirectory(prefix='stage54-nm-') as scratch:
                      for offset, member, digest_value in members:
                          header = data[offset:offset + 60]
                          name_field = header[:16].rstrip(b' ')
                          size = int(header[48:58])
                          payload = offset + 60
                          name_size = int(name_field[3:]) if name_field.startswith(b'#1/') else 0
                          objfile = Path(scratch) / f'{offset}.o'
                          objfile.write_bytes(data[payload + name_size:payload + size])
                          print('arm64e member', offset, repr(member), digest_value)
                          exports = subprocess.check_output(['xcrun', 'nm', '-gUj', objfile], text=True).splitlines()
                          imports = subprocess.check_output(['xcrun', 'nm', '-uj', objfile], text=True).splitlines()
                          print('defined', offset, json.dumps(exports))
                          print('undefined', offset, json.dumps(imports))
                          defined.update(exports)
                  require(required <= defined, f'missing exports: {sorted(required - defined)}')
                  if name == 'ShengUfs':
                      commands = list(directory.glob('*.command.json'))
                      native = [json.loads(p.read_text()) for p in commands
                                if any(Path(a).name == 'NativeUfs.cpp' for a in json.loads(p.read_text()))]
                      require(len(native) == 1, 'missing unique NativeUfs compile record')
                      args = native[0]
                      output = Path(args[args.index('-o') + 1])
                      # The pinned recipe strips the static initializer section before ar.
                      late = output.with_suffix('.late.o')
                      require(late.is_file(), 'missing post-objcopy NativeUfs object')
                      require(hashlib.sha256(late.read_bytes()).hexdigest() in {entry[2] for entry in members},
                              'NativeUfs object bytes are absent from archive')
              except (ValueError, subprocess.CalledProcessError) as exc:
                  raise SystemExit(f'{name} independent archive audit: Fail: {exc}') from exc
              print(name, 'independent archive audit: Pass')
          print('Selected archives complete. Full board archive, final native link and prelink are outside this job.')
          PY
